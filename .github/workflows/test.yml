name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full PHP range on the minimum supported WordPress.
          - { php: '8.1', wp: '7.0', experimental: false }
          - { php: '8.2', wp: '7.0', experimental: false }
          - { php: '8.3', wp: '7.0', experimental: false }
          - { php: '8.4', wp: '7.0', experimental: false }
          # Latest stable release.
          - { php: '8.4', wp: 'latest', experimental: false }
          # Development version: early warning only, allowed to fail.
          - { php: '8.4', wp: 'trunk', experimental: true }

    # Same approach as local development (Laragon): MySQL + WP test library, no wp-env.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: devrivo_chatbot_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Install WordPress test suite
        run: php bin/install-wp-tests.php --wp=${{ matrix.wp }} --db-host=127.0.0.1:3306 --db-user=root --db-pass=root

      - name: Run PHPUnit
        run: composer test
