name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full PHP range on the minimum supported WordPress.
          - { php: '8.1', wp: '7.0', core: 'WordPress/WordPress#7.0', experimental: false }
          - { php: '8.2', wp: '7.0', core: 'WordPress/WordPress#7.0', experimental: false }
          - { php: '8.3', wp: '7.0', core: 'WordPress/WordPress#7.0', experimental: false }
          - { php: '8.4', wp: '7.0', core: 'WordPress/WordPress#7.0', experimental: false }
          # Latest stable WordPress (empty core = wp-env default, latest release).
          - { php: '8.4', wp: 'latest', core: '', experimental: false }
          # Nightly: early warning only, allowed to fail.
          - { php: '8.4', wp: 'trunk', core: 'https://wordpress.org/nightly-builds/wordpress-latest.zip', experimental: true }

    steps:
      - uses: actions/checkout@v7

      # Composer runs on the host; the lock is resolved for PHP 8.1 (config.platform).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Configure wp-env for this matrix entry
        env:
          CORE: ${{ matrix.core }}
          PHP: ${{ matrix.php }}
        run: |
          if [ -n "$CORE" ]; then CORE_JSON="\"$CORE\""; else CORE_JSON=null; fi
          printf '{ "core": %s, "phpVersion": "%s", "plugins": [ "." ] }\n' "$CORE_JSON" "$PHP" > .wp-env.override.json
          cat .wp-env.override.json

      - name: Start wp-env
        run: npm run env:start

      - name: Run PHPUnit
        run: npm run test:php
