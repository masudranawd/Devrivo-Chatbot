name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check size budgets
        run: npm run check:size

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Verify zip contents
        run: |
          # Read the listing once; piping unzip into "grep -q" can fail under pipefail (SIGPIPE).
          files="$(unzip -Z1 devrivo-chatbot.zip)"
          echo "$files" | sort
          if grep -qE '(^|/)(tests|vendor|node_modules|spikes|scripts|bin|\.github)/' <<< "$files"; then
            echo "::error::Dev files found in the release zip."
            exit 1
          fi
          for required in devrivo-chatbot.php readme.txt uninstall.php src/ assets-src/ build/; do
            grep -q "$required" <<< "$files" || { echo "::error::Missing $required in zip."; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: devrivo-chatbot-zip
          path: devrivo-chatbot.zip
          retention-days: 14

  plugin-check:
    name: Plugin Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: devrivo-chatbot-zip

      # Folder name must match the slug, since Plugin Check uses it for the text-domain check.
      - name: Unzip release
        run: |
          mkdir -p dist
          unzip -q devrivo-chatbot.zip -d dist
          ls dist

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/devrivo-chatbot
